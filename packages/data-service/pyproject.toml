[project]
name = "career-data-service"
version = "0.1.0"
description = "Data and AI service for the Career Intelligence Platform: resume processing, GitHub analysis, market intelligence, ML/NLP."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic-settings>=2.6",
    "pymongo>=4.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]