name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx eslint packages shared 2>/dev/null || npx eslint "packages/api/src" "packages/shared/src" "packages/frontend/src" "packages/database"
      - run: npm run build --workspace @career/frontend
      - run: npm test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install data-service
        working-directory: packages/data-service
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        working-directory: packages/data-service
        run: ruff check app tests

      - name: Test
        working-directory: packages/data-service
        run: pytest -q